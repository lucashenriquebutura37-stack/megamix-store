<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar pedido — VORZELI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f6f8;color:#171717}.wrap{max-width:760px;margin:0 auto;padding:28px 18px}.logo{width:150px}.card{margin-top:28px;background:#fff;border:1px solid #e8e8eb;border-radius:22px;padding:26px;box-shadow:0 12px 35px #1111}h1{margin:0 0 10px}p{color:#666;line-height:1.6}.ok{font-size:46px;color:#198754}.btn{display:inline-block;margin-top:12px;background:#171717;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800}input{width:100%;height:48px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font:inherit}button{margin-top:10px;border:0;border-radius:12px;padding:13px 18px;background:#ff5a1f;color:#fff;font-weight:800}.result{margin-top:16px;padding:14px;border-radius:12px;background:#f6f6f7}</style></head><body><main class="wrap"><img class="logo" src="logo-vorzeli.png" alt="VORZELI"><section class="card"><h1>Consultar pedido</h1><p>Digite o código do seu pedido VORZELI.</p><input id="id" placeholder="Ex.: VZ-..."><button onclick="go()">Consultar</button><div id="result"></div><a class="btn" href="/">Voltar para a loja</a></section></main><script>async function go(){const id=document.getElementById("id").value.trim();const box=document.getElementById("result");if(!id)return;box.innerHTML='<div class="result">Consultando...</div>';try{const r=await fetch("/api/pedido/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||"Pedido não encontrado.");const labels={paid:"Pagamento aprovado",pending:"Aguardando pagamento",rejected:"Pagamento recusado",cancelled:"Cancelado",refunded:"Reembolsado",charged_back:"Pagamento estornado"};box.innerHTML='<div class="result"><b>'+d.public_id+'</b><br>Status: '+(labels[d.status]||d.status)+'<br>Total: '+Number(d.total).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'</div>'}catch(e){box.innerHTML='<div class="result">'+e.message+'</div>'}}</script></body></html>
