<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar pedido — VORZELI</title><link rel="canonical" href="https://vorzeli.com.br/pedido.html"><meta name="robots" content="noindex,follow"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f6f8;color:#171717}.wrap{max-width:760px;margin:0 auto;padding:28px 18px}.logo{width:150px}.card{margin-top:28px;background:#fff;border:1px solid #e8e8eb;border-radius:22px;padding:26px;box-shadow:0 12px 35px #1111}h1{margin:0 0 10px}p{color:#666;line-height:1.6}.ok{font-size:46px;color:#198754}.btn{display:inline-block;margin-top:12px;background:#171717;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:800}input{width:100%;height:48px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font:inherit}button{margin-top:10px;border:0;border-radius:12px;padding:13px 18px;background:#ff5a1f;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.result{margin-top:16px;padding:14px;border-radius:12px;background:#f6f6f7}.timeline{margin:16px 0 2px;padding:0;list-style:none}.step{padding:8px 10px;border-left:3px solid #ddd;color:#777}.step.done{border-left-color:#198754;color:#171717;font-weight:700}.step small{display:block;color:#777;font-weight:400;margin-top:3px}.orderProducts{margin-top:16px;border-top:1px solid #e5e5e8;padding-top:12px}.orderProduct{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.deliveredActions{margin-top:16px;padding:14px;background:#eef8f1;border-radius:12px}.deliveredActions a{display:inline-block;margin:8px 6px 0 0;background:#171717;color:#fff;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:800}</style></head><body><main class="wrap"><img class="logo" src="logo-vorzeli.png" alt="VORZELI"><section class="card"><h1>Consultar pedido</h1><p>Digite o código do seu pedido VORZELI.</p><label for="id" style="display:block;font-weight:800;margin:14px 0 6px">Código do pedido</label><input id="id" aria-describedby="orderHelp" placeholder="Ex.: VZ-..." autocomplete="off" autocapitalize="characters"><small id="orderHelp" style="display:block;color:#777;margin-top:6px">O código começa com VZ- e aparece após a compra.</small><button id="consultar" onclick="go()">Consultar</button><div id="result" aria-live="polite" aria-atomic="true"></div><a class="btn" href="/">Voltar para a loja</a></section></main><script>function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function go(){const input=document.getElementById("id"),btn=document.getElementById("consultar"),id=input.value.trim().toUpperCase();const box=document.getElementById("result");if(!id)return;input.value=id;btn.disabled=true;btn.textContent="Consultando...";box.innerHTML='<div class="result">Consultando...</div>';try{const r=await fetch("/api/pedido/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||"Pedido não encontrado.");const labels={paid:"Pagamento aprovado",pending:"Aguardando pagamento",rejected:"Pagamento recusado",cancelled:"Cancelado",refunded:"Reembolsado",charged_back:"Pagamento estornado",expired:"Pagamento expirado",authorized:"Pagamento autorizado"};const fmt=v=>v?new Date(v).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";const timeline=d.status==="paid"?'<ul class="timeline"><li class="step done">Pagamento aprovado'+(d.paid_at?'<small>'+esc(fmt(d.paid_at))+'</small>':'')+'</li><li class="step '+(["preparando","enviado","entregue"].includes(d.shipping_status)?"done":"")+'">Preparando pedido</li><li class="step '+(["enviado","entregue"].includes(d.shipping_status)?"done":"")+'">Pedido enviado'+(d.shipped_at?'<small>'+esc(fmt(d.shipped_at))+'</small>':'')+'</li><li class="step '+(d.shipping_status==="entregue"?"done":"")+'">Pedido entregue'+(d.delivered_at?'<small>'+esc(fmt(d.delivered_at))+'</small>':'')+'</li></ul>':"";const ships={aguardando_pagamento:"Aguardando pagamento",preparando:"Preparando pedido",enviado:"Pedido enviado",entregue:"Pedido entregue",cancelado:"Envio cancelado"};box.innerHTML='<div class="result"><b>'+esc(d.public_id)+'</b><br>Pagamento: '+esc(labels[d.status]||d.status)+'<br>Entrega: '+esc(ships[d.shipping_status]||d.shipping_status||"Aguardando atualização")+(d.shipping_service_name?'<br>Frete: <b>'+esc(d.shipping_company?d.shipping_company+' • ':'')+esc(d.shipping_service_name)+'</b>'+(d.shipping_price?'<br>Valor do frete: '+Number(d.shipping_price).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):'')+(d.shipping_delivery_time?'<br>Prazo informado: até '+Number(d.shipping_delivery_time)+' dias úteis':''):'')+(d.tracking_code?'<br>Rastreio: <b>'+esc(d.tracking_code)+'</b> <button type="button" class="copyTrack" data-track="'+esc(d.tracking_code)+'" style="padding:6px 9px;margin:4px 0 0">Copiar código</button>':'')+'<br>Total: '+Number(d.total).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+timeline+(Array.isArray(d.items)&&d.items.length?'<div class="orderProducts"><b>Itens do pedido</b>'+d.items.map(i=>'<div class="orderProduct"><span>'+Number(i.quantity)+'× '+esc(i.name)+'</span><span>'+Number(i.unit_price).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'</span></div>').join("")+'</div>':'')+(d.shipping_status==="entregue"&&Array.isArray(d.items)&&d.items.length?'<div class="deliveredActions"><b>Pedido entregue ✓</b><br><small>Conte como foi sua experiência. Sua avaliação será identificada como compra verificada.</small><br>'+d.items.map(i=>'<a href="/?avaliar='+encodeURIComponent(i.product_id)+'&pedido='+encodeURIComponent(d.public_id)+'">Avaliar '+esc(i.name)+'</a>').join(" ")+'</div>':'')+'</div>'}catch(e){box.innerHTML='<div class="result">'+esc(e.message)+'</div>'}finally{btn.disabled=false;btn.textContent="Consultar"}const copy=box.querySelector(".copyTrack");if(copy)copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(copy.dataset.track||"");copy.textContent="Copiado ✓"}catch{copy.textContent="Copie o código acima"}})}input=document.getElementById("id");input.addEventListener("keydown",e=>{if(e.key==="Enter")go()});const q=new URLSearchParams(location.search).get("id");if(q){input.value=q;go()}</script></body></html>
