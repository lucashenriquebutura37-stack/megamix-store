name: Desempenho VORZELI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance.yml'
      - 'index.html'
      - '*.css'
      - 'script.js'
      - 'ui-actions.js'
      - 'server.js'
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the published revision
        run: |
          node - <<'NODE'
          (async()=>{
            for(let attempt=0;attempt<30;attempt++){
              try{
                const response=await fetch('https://vorzeli.com.br/',{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                const revision=response.headers.get('x-vorzeli-revision');
                const html=await response.text();
                if(response.ok&&(revision?revision===process.env.GITHUB_SHA:html.includes('style.css?v=qa2'))){console.log('Versão publicada disponível para medição.');return;}
              }catch{}
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error('A publicação da versão esperada não foi confirmada.');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Audit mobile storefront
        run: |
          mkdir -p performance
          npx --yes lighthouse@13.0.0 https://vorzeli.com.br/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=performance/vorzeli --quiet
          for sample in 2 3; do
            npx --yes lighthouse@13.0.0 https://vorzeli.com.br/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="performance/vorzeli-$sample" --quiet
          done
      - name: Summarize laboratory measurements
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('performance/vorzeli.report.json','utf8'));
          if(report.runtimeError)throw new Error(report.runtimeError.code);
          const lines=['# VORZELI — laboratório móvel',`Consulta: ${report.fetchTime}`,`Endereço final: ${report.finalDisplayedUrl||report.finalUrl}`,'','| Métrica | Resultado |','| --- | --- |'];
          for(const [key,label] of [['largest-contentful-paint','LCP'],['cumulative-layout-shift','CLS'],['total-blocking-time','TBT'],['first-contentful-paint','FCP']])lines.push(`| ${label} | ${report.audits[key]?.displayValue||'não disponível'} |`);
          for(const [key,category] of Object.entries(report.categories))lines.push(`| ${key} | ${Math.round(category.score*100)}/100 |`);
          lines.push('','Uma execução de laboratório não comprova Core Web Vitals de campo. TBT não equivale a INP.');
          const samples=['vorzeli','vorzeli-2','vorzeli-3'].map(name=>JSON.parse(fs.readFileSync(`performance/${name}.report.json`,'utf8')));
          for(const sample of samples)if(sample.runtimeError)throw new Error(sample.runtimeError.code);
          const median=values=>values.sort((a,b)=>a-b)[1];
          const measurements=samples.map((sample,i)=>({sample:i+1,fetchTime:sample.fetchTime,performance:Math.round(sample.categories.performance.score*100),accessibility:Math.round(sample.categories.accessibility.score*100),bestPractices:Math.round(sample.categories['best-practices'].score*100),seo:Math.round(sample.categories.seo.score*100),lcp:sample.audits['largest-contentful-paint'].numericValue,cls:sample.audits['cumulative-layout-shift'].numericValue,tbt:sample.audits['total-blocking-time'].numericValue}));
          lines.push('','## Três amostras','', '| Amostra | Desempenho | LCP | TBT |','| --- | --- | --- | --- |');
          for(const sample of measurements)lines.push(`| ${sample.sample} | ${sample.performance}/100 | ${(sample.lcp/1000).toFixed(2)} s | ${Math.round(sample.tbt)} ms |`);
          const summary={samples:measurements,median:{performance:median(measurements.map(s=>s.performance)),lcp:median(measurements.map(s=>s.lcp)),cls:median(measurements.map(s=>s.cls)),tbt:median(measurements.map(s=>s.tbt))}};
          lines.push('',`Mediana: ${summary.median.performance}/100; LCP ${(summary.median.lcp/1000).toFixed(2)} s; TBT ${Math.round(summary.median.tbt)} ms.`);
          fs.writeFileSync('performance/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vorzeli-lighthouse-mobile
          path: performance/
          retention-days: 14
