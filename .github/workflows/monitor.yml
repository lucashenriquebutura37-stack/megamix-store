name: Disponibilidade VORZELI
on:
  # Monitoramento automatico pausado durante a manutencao planejada.
  # Loja colocada em manutencao no Render em 2026-10-10.
  # Ao reativar a loja (revisao prevista para 2026-11-10), restaurar:
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disponibilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/monitor.js
