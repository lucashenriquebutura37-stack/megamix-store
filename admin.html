<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Produtos — VORZELI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f6f8;color:#171717}.wrap{max-width:1100px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:24px}.panel{background:#fff;border:1px solid #e7e8ec;border-radius:20px;padding:18px;box-shadow:0 8px 30px #1111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:11px;font-weight:800;color:#5f636b;display:block;margin-bottom:5px}input,select{width:100%;height:44px;border:1px solid #dfe1e6;border-radius:12px;padding:0 12px;background:#fff;font:inherit}input:focus,select:focus{outline:3px solid #ff5a1f18;border-color:#ff5a1f}.actions{display:flex;gap:8px;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#ff5a1f;color:#fff}.secondary{background:#eee}.danger{background:#fff0ec;color:#d43d0c}.status{font-size:12px;margin:12px 0;min-height:18px}.list{display:grid;gap:10px;margin-top:18px}.item{background:#fff;border:1px solid #e7e8ec;border-radius:16px;padding:13px;display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center}.thumb{width:58px;height:58px;border-radius:12px;background:#f3f4f6;object-fit:contain}.meta b{display:block}.meta small{color:#747982}.itemActions{display:flex;gap:6px}.itemActions button{padding:8px 10px}.login{display:flex;gap:8px;align-items:end}.login>div{flex:1}.adminConnected{display:none;align-items:center;gap:10px;padding:8px 0}.adminConnected strong{color:#198754}.adminTabs{display:flex;gap:8px;margin:0 0 14px}.order{background:#fff;border:1px solid #e7e8ec;border-radius:16px;padding:14px}.orderHead{display:flex;justify-content:space-between;gap:10px}.orderItems{margin-top:8px;color:#5f636b;font-size:12px}.paid{color:#198754}.pending{color:#b26a00}.order .actions{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(180px,1fr) auto;align-items:center}.order .actions select,.order .actions input,.order .actions button{min-width:0;height:44px}.order .actions button{white-space:nowrap}
@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:48px 1fr}.thumb{width:48px;height:48px}.itemActions{grid-column:1/-1}.head{align-items:flex-start;flex-direction:column}.login{width:100%}.order{padding:15px}.orderHead{align-items:flex-start}.order .actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}.order .actions select,.order .actions input,.order .actions button{width:100%;height:46px}.order .actions button{padding:11px 14px}.orderItems{line-height:1.45}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>Painel de Produtos</h1><small>VORZELI • cadastro e estoque</small></div><div><div class="login" id="loginBox"><div><label>Senha administrativa</label><input id="password" type="password" placeholder="Senha do Render" autocomplete="current-password"></div><button class="secondary" type="button" onclick="loginAdmin()">Entrar</button></div><div class="adminConnected" id="adminConnected"><strong>✓ Administrador conectado</strong><button class="secondary" type="button" onclick="logoutAdmin()">Sair</button></div></div></div>
<div class="adminTabs"><button class="secondary" type="button" onclick="document.getElementById('productSection').scrollIntoView({behavior:'smooth'})">Produtos</button><button class="secondary" type="button" onclick="loadOrders()">Pedidos</button><button class="secondary" type="button" onclick="document.getElementById('testSection').scrollIntoView({behavior:'smooth'})">Teste</button></div>
<section class="panel" id="testSection" style="margin-bottom:18px">
<h2 style="margin-top:0">Pedido de teste</h2><small>Não abre o Mercado Pago, não cobra e não reduz estoque.</small>
<div class="grid" style="margin-top:14px">
<div><label>Nome *</label><input id="tName" placeholder="Cliente de teste"></div><div><label>Telefone *</label><input id="tPhone" placeholder="(00) 00000-0000"></div>
<div><label>CEP *</label><input id="tCep" inputmode="numeric" maxlength="9" placeholder="00000-000"></div><div><label>UF *</label><input id="tState" maxlength="2"></div>
<div class="full"><label>Rua / Avenida *</label><input id="tAddress"></div><div><label>Número *</label><input id="tNumber"></div><div><label>Complemento</label><input id="tExtra"></div>
<div><label>Bairro *</label><input id="tNeighborhood"></div><div><label>Cidade *</label><input id="tCity"></div>
</div><div class="actions"><button class="primary" type="button" onclick="createTestOrder()">Criar pedido de teste</button></div>
<div class="status" id="testOrderStatus"></div>
<hr style="border:0;border-top:1px solid #eee;margin:22px 0">
<h3>Testar frete real</h3><small>Consulta o Melhor Envio sem criar produto, pedido ou cobrança.</small>
<div class="grid" style="margin-top:14px">
<div><label>CEP de destino *</label><input id="fCep" inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
<div><label>Peso (kg)</label><input id="fWeight" type="number" step=".001" value="0.3"></div>
<div><label>Comprimento (cm)</label><input id="fLength" type="number" step=".1" value="20"></div>
<div><label>Largura (cm)</label><input id="fWidth" type="number" step=".1" value="15"></div>
<div><label>Altura (cm)</label><input id="fHeight" type="number" step=".1" value="10"></div>
</div>
<div class="actions"><button class="primary" type="button" onclick="testShipping()">Testar cotação</button></div>
<div class="status" id="freightStatus"></div><div id="freightResults" class="list"></div>
</section><section class="panel" id="productSection">
<form id="form">
<input type="hidden" id="id">
<div class="grid">
<div><label>Nome *</label><input id="n" required></div>
<div><label>URL da foto</label><input id="i" placeholder="https://..."></div>
<div><label>Categoria *</label><select id="c" required></select></div>
<div><label>Subcategoria *</label><select id="sub" required></select></div>
<div><label>Detalhe (Audiologia/Medicina)</label><input id="detail"></div>
<div><label>Estoque</label><input id="stock" type="number" min="0" value="0"></div>
<div><label>Preço *</label><input id="p" type="number" min=".01" step=".01" required></div>
<div><label>Preço antigo</label><input id="oldPrice" type="number" min="0" step=".01"></div>
<div><label>Avaliação (0–5)</label><input id="rating" type="number" min="0" max="5" step=".1"></div>
<div><label>Nº de avaliações</label><input id="reviews" type="number" min="0"></div>
<div><label>Parcelas</label><input id="installments" type="number" min="1" value="10"></div>
<div><label>Frete</label><input id="shipping" placeholder="Calculado pelo CEP"></div>
<div><label>Peso (kg) *</label><input id="weightKg" type="number" min=".001" step=".001" placeholder="0,300"></div>
<div><label>Comprimento (cm) *</label><input id="lengthCm" type="number" min="1" step=".1"></div>
<div><label>Largura (cm) *</label><input id="widthCm" type="number" min="1" step=".1"></div>
<div><label>Altura (cm) *</label><input id="heightCm" type="number" min="1" step=".1"></div>
</div>
<div class="actions"><button class="primary" type="submit">Salvar produto</button><button class="secondary" type="button" onclick="clearForm()">Limpar</button></div>
<div class="status" id="status"></div>
</form>
</section>
<div class="list" id="list"></div><section id="ordersSection" style="margin-top:28px"><h2>Pedidos</h2><div class="panel" id="orderTools" style="margin:10px 0 14px;display:none"><div class="grid"><div><label>Buscar pedido</label><input id="orderSearch" placeholder="Pedido, cliente, cidade..." oninput="renderOrders()"></div><div><label>Filtrar</label><select id="orderFilter" onchange="renderOrders()"><option value="">Todos</option><option value="paid">Pagos</option><option value="pending">Pendentes</option><option value="test">Testes</option><option value="enviado">Enviados</option><option value="entregue">Entregues</option></select></div></div><div id="orderSummary" class="status"></div></div><div class="list" id="ordersList"><div class="panel">Entre como administrador para visualizar pedidos.</div></div></section>
</main>
<script src="script.js"></script>
<script>
const $=id=>document.getElementById(id);
let adminProducts=[];
let adminPassword="";
let adminOrders=[];
function pass(){return adminPassword}
function status(t,ok=true){$("status").textContent=t;$("status").style.color=ok?"#198754":"#c0392b"}
function setupCategories(){
 $("c").innerHTML='<option value="">Selecione</option>'+areas.map(a=>'<option>'+a.name+'</option>').join("");
 $("c").addEventListener("change",()=>{
   const a=areas.find(x=>x.name===$("c").value);
   $("sub").innerHTML='<option value="">Selecione</option>'+(a?a.subs.map(x=>'<option>'+x[0]+'</option>').join(""):"");
 });
}
async function loginAdmin(){
 const typed=$("password").value;
 if(!typed){status("Digite a senha administrativa.",false);return;}
 try{
  const r=await fetch("/api/admin/auth",{method:"POST",headers:{"x-admin-password":typed}});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"Senha administrativa inválida.");
  adminPassword=typed;$("password").value="";$("loginBox").style.display="none";$("adminConnected").style.display="flex";
  status("Administrador conectado.");await loadProducts();await loadOrders();
 }catch(e){$("password").value="";status(e.message,false)}
}
function logoutAdmin(){$("ordersList").innerHTML='<div class="panel">Entre como administrador para visualizar pedidos.</div>';adminPassword="";$("password").value="";$("loginBox").style.display="flex";$("adminConnected").style.display="none";status("Sessão administrativa encerrada.");}
async function loadProducts(){
 try{const r=await fetch("/api/produtos");adminProducts=await r.json();renderList();status("Catálogo carregado.");}
 catch(e){status("Erro ao carregar catálogo.",false)}
}

async function testShipping(){
 if(!adminPassword){status("Entre como administrador primeiro.",false);return}
 const fs=$("freightStatus"),box=$("freightResults"),cep=$("fCep").value.replace(/\D/g,"");
 fs.textContent="Consultando Melhor Envio...";fs.style.color="#5f636b";box.innerHTML="";
 try{
  const r=await fetch("/api/admin/frete-teste",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pass()},body:JSON.stringify({postal_code:cep,weight_kg:$("fWeight").value,length_cm:$("fLength").value,width_cm:$("fWidth").value,height_cm:$("fHeight").value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Erro na cotação.");
  fs.textContent="Integração funcionando • ambiente: "+d.environment;fs.style.color="#198754";
  box.innerHTML=d.quotes?.length?d.quotes.map(q=>'<div class="order"><b>'+(q.company?q.company+" • ":"")+q.name+'</b><div class="orderItems">R$ '+Number(q.price).toFixed(2).replace(".",",")+(q.delivery_time?" • até "+q.delivery_time+" dias úteis":"")+'</div></div>').join(""):'<div class="order">A API respondeu, mas não retornou opções para esse CEP.</div>';
 }catch(e){fs.textContent=e.message;fs.style.color="#c0392b";}
}
async function createTestOrder(){
 if(!adminPassword){$("testOrderStatus").textContent="Entre como administrador primeiro.";$("testOrderStatus").style.color="#c0392b";return}
 const tos=$("testOrderStatus");tos.textContent="Criando pedido de teste...";tos.style.color="#5f636b";
 const cep=$("tCep").value.replace(/\D/g,"");
 const customer={name:$("tName").value,phone:$("tPhone").value,postalCode:cep,address:$("tAddress").value,number:$("tNumber").value,extra:$("tExtra").value,neighborhood:$("tNeighborhood").value,city:$("tCity").value,state:$("tState").value.toUpperCase()};
 try{
  const r=await fetch("/api/admin/pedido-teste",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pass()},body:JSON.stringify({customer})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Erro ao criar teste.");
  tos.textContent="Pedido de teste criado: "+d.order_id;tos.style.color="#198754";await loadOrders();
 }catch(e){tos.textContent=e.message;tos.style.color="#c0392b"}
}
(function setupTestCep(){
 const el=$("tCep");if(!el)return;let last="";
 async function lookup(){
  const cep=el.value.replace(/\D/g,"").slice(0,8);el.value=cep.length>5?cep.slice(0,5)+"-"+cep.slice(5):cep;
  if(cep.length!==8||cep===last)return;last=cep;
  try{const r=await fetch("https://viacep.com.br/ws/"+cep+"/json/");const d=await r.json();if(!r.ok||d.erro)throw 0;
   $("tAddress").value=d.logradouro||"";$("tNeighborhood").value=d.bairro||"";$("tCity").value=d.localidade||"";$("tState").value=d.uf||"";$("tNumber").focus();
  }catch{last="";status("CEP não encontrado. Você pode preencher manualmente.",false)}
 }
 el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"").slice(0,8);el.value=d.length>5?d.slice(0,5)+"-"+d.slice(5):d;if(d.length===8)lookup();else last=""});
 el.addEventListener("blur",lookup);
})();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderOrders(){
 const q=($("orderSearch")?.value||"").toLowerCase(),filter=$("orderFilter")?.value||"";
 const data=adminOrders.filter(o=>{
   const hay=[o.public_id,o.customer_name,o.customer_phone,o.city,o.state,o.shipping_company,o.shipping_service_name].join(" ").toLowerCase();
   const matchQ=!q||hay.includes(q);
   const matchF=!filter||(filter==="enviado"||filter==="entregue"?o.shipping_status===filter:o.status===filter);
   return matchQ&&matchF;
 });
 const paid=adminOrders.filter(o=>o.status==="paid"&&!o.is_test), revenue=paid.reduce((a,o)=>a+Number(o.total||0),0);
 if($("orderSummary"))$("orderSummary").textContent=adminOrders.length+" pedidos • "+paid.length+" pagos • "+revenue.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
 const box=$("ordersList");
 box.innerHTML=data.length?data.map(o=>{
   const lines=(o.items||[]).map(i=>esc(i.quantity)+"× "+esc(i.name)).join("<br>");
   const label=o.is_test?"PEDIDO DE TESTE":(o.status==="paid"?"PAGO":String(o.status).toUpperCase());
   const shipLabels={aguardando_pagamento:"Aguardando pagamento",preparando:"Preparando",enviado:"Enviado",entregue:"Entregue",cancelado:"Cancelado"};
   const address=[o.address_line,o.address_number,o.address_extra,o.neighborhood,o.city,o.state,o.postal_code].filter(Boolean).map(esc).join(" • ");
   return '<div class="order"><div class="orderHead"><div><b>'+esc(o.public_id)+'</b><br><small>'+new Date(o.created_at).toLocaleString("pt-BR")+'</small></div><div><b>R$ '+Number(o.total).toFixed(2).replace(".",",")+'</b><br><strong class="'+(o.status==="paid"?"paid":"pending")+'">'+esc(label)+'</strong></div></div><div class="orderItems">'+lines+'</div>'+(o.customer_name?'<div class="orderItems"><b>'+esc(o.customer_name)+'</b> • '+esc(o.customer_phone||"")+'<br>'+address+'</div>':'')+'<div class="orderItems"><b>Entrega:</b> '+esc(shipLabels[o.shipping_status]||o.shipping_status||"—")+(o.shipping_service_name?'<br><b>Frete:</b> '+esc(o.shipping_company?o.shipping_company+" • ":"")+esc(o.shipping_service_name)+' • R$ '+Number(o.shipping_price||0).toFixed(2).replace(".",",")+(o.shipping_delivery_time?' • até '+Number(o.shipping_delivery_time)+' dias úteis':''):'')+(o.tracking_code?'<br><b>Rastreio:</b> '+esc(o.tracking_code):'')+'</div><div class="actions"><select id="ship-'+esc(o.public_id)+'"><option value="aguardando_pagamento">Aguardando pagamento</option><option value="preparando">Preparando</option><option value="enviado">Enviado</option><option value="entregue">Entregue</option><option value="cancelado">Cancelado</option></select><input id="track-'+esc(o.public_id)+'" placeholder="Código de rastreio" value="'+esc(o.tracking_code||"")+'"><button class="primary" type="button" onclick="updateShipping(\''+esc(o.public_id)+'\')">Atualizar envio</button></div></div>';
 }).join(""):'<div class="panel">Nenhum pedido encontrado.</div>';
 data.forEach(o=>{const sel=$("ship-"+o.public_id);if(sel)sel.value=o.shipping_status||"aguardando_pagamento"});
}
async function loadOrders(){
 if(!adminPassword)return;
 try{
  const r=await fetch("/api/pedidos",{headers:{"x-admin-password":pass()}});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"Erro ao carregar pedidos.");
  adminOrders=data;$("orderTools").style.display="block";renderOrders();
  $("ordersSection").scrollIntoView({behavior:"smooth"});
 }catch(e){status(e.message,false)}
}
async function updateShipping(id){
 try{
  const sel=$("ship-"+id), track=$("track-"+id);
  const r=await fetch("/api/pedidos/"+encodeURIComponent(id)+"/envio",{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-password":pass()},body:JSON.stringify({shipping_status:sel.value,tracking_code:track.value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Erro ao atualizar envio.");
  status("Envio atualizado.");await loadOrders();
 }catch(e){status(e.message,false)}
}
function renderList(){
 $("list").innerHTML=adminProducts.length?adminProducts.map(p=>`
 <div class="item">
  ${p.i&&/^https?:/i.test(p.i)?'<img class="thumb" src="'+p.i+'" alt="">':'<div class="thumb"></div>'}
  <div class="meta"><b>${esc(p.n)}</b><small>${esc(p.c)} › ${esc(p.sub)} • R$ ${Number(p.p).toFixed(2).replace(".",",")} • estoque: ${p.stock||0}</small></div>
  <div class="itemActions"><button class="secondary" onclick="editProduct('${p.id}')">Editar</button><button class="danger" onclick="removeProduct('${p.id}')">Excluir</button></div>
 </div>`).join(""):'<div class="panel">Nenhum produto cadastrado ainda.</div>';
}
function editProduct(id){
 const p=adminProducts.find(x=>String(x.id)===String(id));if(!p)return;
 ["id","n","i","c","detail","stock","p","oldPrice","rating","reviews","installments","shipping","weightKg","lengthCm","widthCm","heightCm"].forEach(k=>{if($(k))$(k).value=p[k]??""});
 $("c").dispatchEvent(new Event("change"));$("sub").value=p.sub||"";scrollTo({top:0,behavior:"smooth"});
}
function clearForm(){$("form").reset();$("id").value="";$("installments").value=10;$("stock").value=0;$("sub").innerHTML='<option value="">Selecione</option>'}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const id=$("id").value;
 const body={n:$("n").value,i:$("i").value,c:$("c").value,sub:$("sub").value,detail:$("detail").value,stock:$("stock").value,p:$("p").value,oldPrice:$("oldPrice").value,rating:$("rating").value,reviews:$("reviews").value,installments:$("installments").value,shipping:$("shipping").value,weightKg:$("weightKg").value,lengthCm:$("lengthCm").value,widthCm:$("widthCm").value,heightCm:$("heightCm").value};
 try{
  const r=await fetch(id?"/api/produtos/"+id:"/api/produtos",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json","x-admin-password":pass()},body:JSON.stringify(body)});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"Erro");
  status(id?"Produto atualizado.":"Produto cadastrado.");clearForm();await loadProducts();
 }catch(e){status(e.message,false)}
});
async function removeProduct(id){
 if(!confirm("Excluir este produto?"))return;
 try{const r=await fetch("/api/produtos/"+id,{method:"DELETE",headers:{"x-admin-password":pass()}});const data=await r.json();if(!r.ok)throw new Error(data.error||"Erro");await loadProducts();status("Produto excluído.");}catch(e){status(e.message,false)}
}
setupCategories();loadProducts();
</script></body></html>
